<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Despertador antiguo con dos teléfonos móviles">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#dfe8ff"/>
      <stop offset="1" stop-color="#8097d7"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f7f7"/>
      <stop offset="0.22" stop-color="#cfd5df"/>
      <stop offset="0.45" stop-color="#fff"/>
      <stop offset="0.72" stop-color="#8c9aac"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2f3747"/>
      <stop offset="0.45" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#677083"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#16224b"/>
      <stop offset="0.52" stop-color="#050816"/>
      <stop offset="1" stop-color="#2d9cff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="34" stdDeviation="30" flood-color="#071126" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="600" cy="690" rx="430" ry="58" fill="#102044" opacity="0.28" filter="url(#soft)"/>
  
  <!-- Left phone -->
  <g transform="translate(235 178) rotate(-10 145 250)" filter="url(#shadow)">
    <rect x="0" y="0" width="285" height="520" rx="44" fill="url(#darkMetal)"/>
    <rect x="20" y="22" width="245" height="470" rx="30" fill="url(#screen)"/>
    <circle cx="142" cy="502" r="12" fill="#aab4c8" opacity="0.85"/>
    <rect x="92" y="14" width="100" height="8" rx="4" fill="#aab4c8" opacity="0.6"/>
    <path d="M60 90 C110 40 210 68 230 135" fill="none" stroke="#77c8ff" stroke-width="14" opacity="0.55" stroke-linecap="round"/>
    <text x="142" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#eaf6ff">Móvil A</text>
    <text x="142" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#9bd8ff">enviar</text>
    <text x="142" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#9bd8ff">alarma</text>
  </g>
  
  <!-- Right phone -->
  <g transform="translate(680 178) rotate(10 145 250)" filter="url(#shadow)">
    <rect x="0" y="0" width="285" height="520" rx="44" fill="url(#darkMetal)"/>
    <rect x="20" y="22" width="245" height="470" rx="30" fill="url(#screen)"/>
    <circle cx="142" cy="502" r="12" fill="#aab4c8" opacity="0.85"/>
    <rect x="92" y="14" width="100" height="8" rx="4" fill="#aab4c8" opacity="0.6"/>
    <path d="M55 370 C105 420 205 392 232 325" fill="none" stroke="#8ef0c0" stroke-width="14" opacity="0.55" stroke-linecap="round"/>
    <text x="142" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#eafff4">Móvil B</text>
    <text x="142" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#a4ffd2">recibir</text>
    <text x="142" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#a4ffd2">confirmar</text>
  </g>
  
  <!-- Alarm clock -->
  <g transform="translate(426 165)" filter="url(#shadow)">
    <path d="M135 86 C78 48 54 18 82 0 C118 -20 174 27 176 83" fill="url(#metal)" stroke="#596273" stroke-width="8"/>
    <path d="M337 86 C394 48 418 18 390 0 C354 -20 298 27 296 83" fill="url(#metal)" stroke="#596273" stroke-width="8"/>
    <rect x="216" y="25" width="40" height="62" rx="16" fill="url(#metal)" stroke="#596273" stroke-width="8"/>
    <circle cx="236" cy="300" r="220" fill="url(#metal)" stroke="#4a5365" stroke-width="12"/>
    <circle cx="236" cy="300" r="176" fill="#f7fbff" stroke="#a8b1c1" stroke-width="10"/>
    <circle cx="236" cy="300" r="12" fill="#121827"/>
    <g stroke="#121827" stroke-width="7" stroke-linecap="round">
      <line x1="236" y1="300" x2="236" y2="190"/>
      <line x1="236" y1="300" x2="330" y2="300"/>
    </g>
    <g font-family="Arial, sans-serif" font-size="31" fill="#121827" font-weight="700">
      <text x="226" y="162">12</text><text x="352" y="310">3</text><text x="228" y="452">6</text><text x="96" y="310">9</text>
    </g>
    <path d="M102 493 L57 585" stroke="#4a5365" stroke-width="16" stroke-linecap="round"/>
    <path d="M370 493 L415 585" stroke="#4a5365" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="236" cy="300" rx="122" ry="150" fill="#fff" opacity="0.18" transform="rotate(-25 236 300)"/>
  </g>
</svg>
