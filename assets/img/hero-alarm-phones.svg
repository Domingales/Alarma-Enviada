<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Caricatura 3D de un despertador con dos móviles">
  <defs>
    <linearGradient id="phoneA" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#8be9ff"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="phoneB" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ffdf7e"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <radialGradient id="clock" cx="50%" cy="35%" r="65%"><stop offset="0" stop-color="#fff7b8"/><stop offset="0.52" stop-color="#ffd166"/><stop offset="1" stop-color="#f59e0b"/></radialGradient>
    <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset=".45" stop-color="#94a3b8"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="26" stdDeviation="20" flood-color="#000" flood-opacity=".32"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <!-- Sombra suave, el fondo real queda transparente -->
  <ellipse cx="450" cy="448" rx="300" ry="42" fill="#000" opacity=".18" filter="url(#soft)"/>

  <!-- Teléfono izquierdo -->
  <g filter="url(#shadow)" transform="translate(112 78) rotate(-10)">
    <rect x="0" y="0" width="180" height="330" rx="38" fill="#172033"/>
    <rect x="16" y="22" width="148" height="286" rx="28" fill="url(#phoneA)"/>
    <circle cx="90" cy="313" r="9" fill="#dbeafe" opacity=".9"/>
    <rect x="54" y="44" width="72" height="9" rx="5" fill="#dbeafe" opacity=".72"/>
    <circle cx="60" cy="132" r="30" fill="#fff" opacity=".9"/>
    <path d="M92 124h44v18H92z" fill="#fff" opacity=".75"/>
    <path d="M48 212c35-44 67 44 106-10" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity=".85"/>
    <circle cx="144" cy="70" r="16" fill="#34d399" stroke="#fff" stroke-width="6"/>
  </g>

  <!-- Teléfono derecho -->
  <g filter="url(#shadow)" transform="translate(606 80) rotate(10)">
    <rect x="0" y="0" width="180" height="330" rx="38" fill="#1f2937"/>
    <rect x="16" y="22" width="148" height="286" rx="28" fill="url(#phoneB)"/>
    <circle cx="90" cy="313" r="9" fill="#fff7ed" opacity=".9"/>
    <rect x="54" y="44" width="72" height="9" rx="5" fill="#fff7ed" opacity=".75"/>
    <circle cx="70" cy="126" r="24" fill="#fff" opacity=".9"/>
    <circle cx="112" cy="126" r="24" fill="#fff" opacity=".75"/>
    <path d="M50 222h86M50 255h64" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity=".86"/>
    <circle cx="38" cy="72" r="16" fill="#a78bfa" stroke="#fff" stroke-width="6"/>
  </g>

  <!-- Despertador antiguo central -->
  <g filter="url(#shadow)">
    <g transform="translate(450 250)">
      <path d="M-112 -140c-30-46-94-25-101 27-4 33 20 59 50 65" fill="url(#metal)" stroke="#475569" stroke-width="10"/>
      <path d="M112 -140c30-46 94-25 101 27 4 33-20 59-50 65" fill="url(#metal)" stroke="#475569" stroke-width="10"/>
      <path d="M-42 -164c10-24 74-24 84 0" fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="146" fill="url(#clock)" stroke="#78350f" stroke-width="16"/>
      <circle cx="0" cy="0" r="112" fill="#fff7d6" stroke="#fbbf24" stroke-width="8"/>
      <circle cx="0" cy="0" r="10" fill="#78350f"/>
      <path d="M0 0v-70" stroke="#78350f" stroke-width="12" stroke-linecap="round"/>
      <path d="M0 0l58 40" stroke="#78350f" stroke-width="12" stroke-linecap="round"/>
      <g font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#92400e" text-anchor="middle">
        <text x="0" y="-82">12</text><text x="82" y="10">3</text><text x="0" y="94">6</text><text x="-84" y="10">9</text>
      </g>
      <path d="M-78 126l-28 46M78 126l28 46" stroke="#78350f" stroke-width="14" stroke-linecap="round"/>
      <path d="M-150 9c18 18 18 49 0 67M150 9c-18 18-18 49 0 67" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".55"/>
    </g>
  </g>

  <!-- Detalles divertidos -->
  <g opacity=".95">
    <circle cx="92" cy="116" r="12" fill="#fb7185"/>
    <circle cx="806" cy="118" r="10" fill="#22c55e"/>
    <circle cx="218" cy="420" r="9" fill="#facc15"/>
    <circle cx="702" cy="420" r="12" fill="#38bdf8"/>
    <path d="M332 89l17 34 37 5-27 26 7 37-34-18-33 18 6-37-27-26 38-5z" fill="#f472b6" opacity=".9"/>
    <path d="M578 75l13 27 30 4-22 21 5 30-26-14-27 14 5-30-22-21 30-4z" fill="#a3e635" opacity=".9"/>
  </g>
</svg>
