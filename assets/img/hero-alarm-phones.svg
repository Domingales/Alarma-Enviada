<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Despertador antiguo 3D con dos móviles">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="phoneA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1028"/>
      <stop offset="0.5" stop-color="#18265c"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="phoneB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="clockFace" cx="48%" cy="42%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.66" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.22" stop-color="#94a3b8"/>
      <stop offset="0.48" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#64748b"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- SVG sin rectángulo de fondo: transparente -->
  <g filter="url(#softShadow)">
    <ellipse cx="450" cy="492" rx="330" ry="46" fill="#0f172a" opacity="0.18"/>

    <!-- Teléfono izquierdo -->
    <g transform="translate(142 118) rotate(-12 130 180)">
      <rect x="0" y="0" width="225" height="360" rx="34" fill="#0f172a"/>
      <rect x="13" y="18" width="199" height="318" rx="25" fill="url(#phoneA)"/>
      <rect x="70" y="13" width="85" height="8" rx="4" fill="#cbd5e1" opacity=".65"/>
      <circle cx="112" cy="344" r="10" fill="#e2e8f0" opacity=".8"/>
      <path d="M55 95c36-38 88-38 124 0" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity=".9"/>
      <text x="112" y="170" text-anchor="middle" font-size="31" font-weight="900" fill="#fff" font-family="Arial, sans-serif">Móvil A</text>
      <text x="112" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#bfdbfe" font-family="Arial, sans-serif">envía</text>
      <text x="112" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#bfdbfe" font-family="Arial, sans-serif">alarma</text>
      <circle cx="52" cy="268" r="10" fill="#22d3ee" opacity=".65"/>
      <circle cx="174" cy="265" r="7" fill="#a78bfa" opacity=".8"/>
    </g>

    <!-- Teléfono derecho -->
    <g transform="translate(538 116) rotate(12 130 180)">
      <rect x="0" y="0" width="225" height="360" rx="34" fill="#0f172a"/>
      <rect x="13" y="18" width="199" height="318" rx="25" fill="url(#phoneB)"/>
      <rect x="70" y="13" width="85" height="8" rx="4" fill="#cbd5e1" opacity=".65"/>
      <circle cx="112" cy="344" r="10" fill="#e2e8f0" opacity=".8"/>
      <path d="M58 96c28 34 80 43 119 8" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round" opacity=".9"/>
      <text x="112" y="170" text-anchor="middle" font-size="31" font-weight="900" fill="#fff" font-family="Arial, sans-serif">Móvil B</text>
      <text x="112" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#cffafe" font-family="Arial, sans-serif">recibe</text>
      <text x="112" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#cffafe" font-family="Arial, sans-serif">aviso</text>
      <circle cx="58" cy="262" r="8" fill="#facc15" opacity=".85"/>
      <circle cx="170" cy="278" r="11" fill="#22d3ee" opacity=".55"/>
    </g>

    <!-- Despertador central -->
    <g transform="translate(0 10)">
      <line x1="360" y1="430" x2="318" y2="512" stroke="#475569" stroke-width="14" stroke-linecap="round"/>
      <line x1="540" y1="430" x2="582" y2="512" stroke="#475569" stroke-width="14" stroke-linecap="round"/>
      <ellipse cx="450" cy="268" rx="165" ry="165" fill="url(#metal)"/>
      <ellipse cx="450" cy="268" rx="136" ry="136" fill="url(#clockFace)" stroke="#cbd5e1" stroke-width="8"/>
      <circle cx="450" cy="268" r="12" fill="#334155"/>
      <line x1="450" y1="268" x2="450" y2="170" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
      <line x1="450" y1="268" x2="525" y2="268" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
      <text x="450" y="155" text-anchor="middle" font-size="33" font-weight="900" fill="#111827" font-family="Arial, sans-serif">12</text>
      <text x="450" y="406" text-anchor="middle" font-size="33" font-weight="900" fill="#111827" font-family="Arial, sans-serif">6</text>
      <text x="320" y="279" text-anchor="middle" font-size="33" font-weight="900" fill="#111827" font-family="Arial, sans-serif">9</text>
      <text x="580" y="279" text-anchor="middle" font-size="33" font-weight="900" fill="#111827" font-family="Arial, sans-serif">3</text>
      <g stroke="#475569" stroke-width="5" stroke-linecap="round">
        <line x1="382" y1="151" x2="390" y2="166"/><line x1="518" y1="151" x2="510" y2="166"/>
        <line x1="566" y1="200" x2="551" y2="208"/><line x1="566" y1="336" x2="551" y2="328"/>
        <line x1="518" y1="385" x2="510" y2="370"/><line x1="382" y1="385" x2="390" y2="370"/>
        <line x1="334" y1="336" x2="349" y2="328"/><line x1="334" y1="200" x2="349" y2="208"/>
      </g>
      <path d="M337 111c-24-44-74-29-89 8-8 21-2 49 18 66 45-19 76-42 71-74z" fill="url(#metal)" stroke="#64748b" stroke-width="7"/>
      <path d="M563 111c24-44 74-29 89 8 8 21 2 49-18 66-45-19-76-42-71-74z" fill="url(#metal)" stroke="#64748b" stroke-width="7"/>
      <rect x="431" y="58" width="38" height="52" rx="17" fill="url(#metal)" stroke="#64748b" stroke-width="7"/>
    </g>

    <!-- Estrellas y elementos divertidos -->
    <g opacity=".92">
      <path d="M690 90c11 29 20 38 49 49-29 11-38 20-49 49-11-29-20-38-49-49 29-11 38-20 49-49z" fill="#fbbf24" opacity=".75"/>
      <path d="M214 76c7 20 14 27 34 34-20 7-27 14-34 34-7-20-14-27-34-34 20-7 27-14 34-34z" fill="#67e8f9" opacity=".75"/>
      <circle cx="744" cy="421" r="20" fill="#fb7185" opacity=".8"/>
      <circle cx="172" cy="420" r="18" fill="#facc15" opacity=".8"/>
    </g>
  </g>
</svg>
